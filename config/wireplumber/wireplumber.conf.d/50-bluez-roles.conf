monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.roles = [ a2dp_sink a2dp_source hsp_hs hsp_ag hfp_hf hfp_ag ]
        bluez5.codecs = [ sbc sbc_xq aac ]
        bluez5.enable-sbc-xq = true
        bluez5.enable-msbc = false
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
